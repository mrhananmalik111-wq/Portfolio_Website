<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Welcome · Hamza Malik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e17;
            --accent-1: #6c5ce7;
            --accent-2: #00b4d8;
            --text: #e8edf5;
            --text-dim: #8899bb;
            --gradient: linear-gradient(135deg, #6c5ce7, #00b4d8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #introOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        #introOverlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            pointer-events: none;
        }
        .intro-orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-1);
            top: -120px;
            right: -100px;
            animation: floatOrb 9s ease-in-out infinite;
        }
        .intro-orb-2 {
            width: 350px;
            height: 350px;
            background: var(--accent-2);
            bottom: -80px;
            left: -80px;
            animation: floatOrb 11s ease-in-out infinite reverse;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .intro-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            padding: 0 1.5rem;
        }

        .intro-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 1.8rem;
            letter-spacing: 0.3px;
        }
        .intro-badge .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulseDot 1.6s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .intro-title {
            font-size: clamp(2.8rem, 9vw, 5.2rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 0.8rem;
        }

        .intro-title .highlight {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .intro-sub {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-dim);
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto 2rem;
            line-height: 1.8;
        }

        .intro-loader {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin: 0 auto 2rem;
            overflow: hidden;
        }
        .intro-loader .bar {
            width: 0%;
            height: 100%;
            background: var(--gradient);
            border-radius: 10px;
            animation: loadBar 2s ease-in-out forwards;
        }
        @keyframes loadBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .enter-btn {
            padding: 0.9rem 2.8rem;
            border-radius: 60px;
            border: none;
            background: var(--gradient);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.3);
            transition: 0.3s;
            opacity: 0;
            transform: translateY(14px);
            animation: fadeBtn 0.9s 2s ease forwards;
        }
        .enter-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(108, 92, 231, 0.5);
        }
        @keyframes fadeBtn {
            to { opacity: 1; transform: translateY(0); }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(108, 92, 231, 0.15);
            pointer-events: none;
            animation: floatParticle 6s ease-in-out infinite alternate;
        }
        .p1 { width: 12px; height: 12px; top: 15%; left: 12%; animation-delay: 0s; }
        .p2 { width: 18px; height: 18px; bottom: 20%; right: 10%; animation-delay: 1.2s; }
        .p3 { width: 8px; height: 8px; top: 40%; right: 20%; animation-delay: 2.4s; }

        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(20px, -30px) scale(1.5); opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .intro-badge { font-size: 0.7rem; padding: 0.3rem 1rem; }
            .enter-btn { padding: 0.7rem 2rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div id="introOverlay">
        <div class="intro-orb intro-orb-1"></div>
        <div class="intro-orb intro-orb-2"></div>

        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>

        <div class="intro-content">
            <div class="intro-badge">
                <span class="pulse-dot"></span>
                Hamza Malik · MERN Stack
            </div>

            <h1 class="intro-title">
                Welcome to <br><span class="highlight">Hamza Malik’s</span> Portfolio
            </h1>

            <p class="intro-sub">
                Building scalable, responsive, and real-world web applications.
            </p>

            <div class="intro-loader">
                <div class="bar"></div>
            </div>

            <button class="enter-btn" id="enterBtn">
                <i class="fa-regular fa-circle-check"></i> Enter Website
            </button>
        </div>
    </div>

    <script>
        (function() {
            const introOverlay = document.getElementById('introOverlay');
            const enterBtn = document.getElementById('enterBtn');

            function redirectToMain() {
                if (introOverlay.classList.contains('hide')) return;
                introOverlay.classList.add('hide');
                window.location.href = 'portfolio.html';
            }

            let autoTimer = setTimeout(redirectToMain, 4000);

            enterBtn.addEventListener('click', function(e) {
                clearTimeout(autoTimer);
                redirectToMain();
            });

            document.addEventListener('keydown', function firstKey() {
                clearTimeout(autoTimer);
                redirectToMain();
                document.removeEventListener('keydown', firstKey);
            }, { once: true });

            window.addEventListener('scroll', function firstScroll() {
                clearTimeout(autoTimer);
                redirectToMain();
                window.removeEventListener('scroll', firstScroll);
            }, { once: true });

            introOverlay.addEventListener('click', function(e) {
                if (e.target === introOverlay) {
                    clearTimeout(autoTimer);
                    redirectToMain();
                }
            });

        })();
    </script>

</body>
</html>
